arazzo: 1.0.1

info:
  title: Full End-to-End Payment
  summary: Nine-step workflow executing a complete payment across two wallets with interactive grant
  version: 1.0.0
  description: |-
    Documents the complete nine-step sequence required to execute a payment
    from a payer's Open Payments-enabled wallet to a payee's wallet.

    This workflow is the core of the Open Payments protocol. It combines the
    three sub-flows — incoming payment creation, quote creation, and outgoing
    payment creation — into a single end-to-end sequence that crosses two
    wallets and two authorization servers.

    The workflow has two phases. The first phase (steps 1-3) runs on the
    payee's side and creates a destination for funds. The second phase
    (steps 4-9) runs on the payer's side and moves the funds.

    Step 7 requests an outgoing payment grant, which requires explicit
    approval from the payer. This is the only interactive step in the Open
    Payments protocol — the authorization server redirects the payer to an
    approval screen before issuing an access token. The workflow cannot
    proceed past step 7 until the payer has approved. Two inputs, interactRef
    and continueId, carry the values produced by that approval back into the
    workflow for step 8 to consume.

    No funds move until step 9 executes. All prior steps are setup — creating
    resources, obtaining grants, and locking in the exchange rate via a quote.
    Once the outgoing payment resource is created in step 9, the payer's ASE
    begins executing the ILP payment immediately.

sourceDescriptions:
  - name: wallet-address-server
    url: ../specs/wallet-address-server.yaml
    type: openapi
  - name: auth-server
    url: ../specs/auth-server.yaml
    type: openapi
  - name: resource-server
    url: ../specs/resource-server.yaml
    type: openapi

workflows:
  - workflowId: end-to-end-payment
    summary: Execute a full payment from payer to payee
    description: |-
      Resolves both wallet addresses, creates an incoming payment on the
      payee's resource server, creates a quote on the payer's resource server,
      requests an interactive outgoing payment grant, continues the grant after
      payer approval, and creates the outgoing payment that executes the transfer.

    inputs:
      type: object
      required:
        - payeeWalletAddress
        - payerWalletAddress
        - clientWalletAddress
        - clientRedirectUri
        - interactNonce
        - interactRef
        - continueId
      properties:
        payeeWalletAddress:
          type: string
          format: uri
          description: |-
            The wallet address URL of the payment recipient. Used in step 1
            to discover the payee's authorization and resource server endpoints.
            Also used as the walletAddress field when creating the incoming
            payment in step 3.
          example: https://ilp.interledger-test.dev/bob
        payerWalletAddress:
          type: string
          format: uri
          description: |-
            The wallet address URL of the payer. Used in step 4 to discover
            the payer's authorization and resource server endpoints. Also used
            as the walletAddress field when creating the quote in step 6 and
            the outgoing payment in step 9, and as the identifier in the
            outgoing payment grant access object in step 7.
          example: https://ilp.interledger-test.dev/alice
        clientWalletAddress:
          type: string
          format: uri
          description: |-
            The wallet address URL of the client executing this workflow. Sent
            as the client identifier in all three grant requests so the
            authorization servers can resolve and verify the client's public
            keys. In many implementations this is the same as payerWalletAddress
            but it is kept separate here because the protocol treats them as
            distinct concepts.
          example: https://ilp.interledger-test.dev/alice
        clientRedirectUri:
          type: string
          format: uri
          description: |-
            The URI the authorization server redirects the payer to after they
            approve or deny the outgoing payment grant. The AS appends an
            interact_ref query parameter to this URI, which the client must
            capture and supply as the interactRef input before step 8 can run.
            This URI must be registered with or trusted by the authorization
            server in advance.
          example: https://myapp.example.com/payment/callback
        interactNonce:
          type: string
          description: |-
            A unique random string generated by the client before sending the
            outgoing payment grant request in step 7. The authorization server
            echoes this value in the finish redirect so the client can verify
            the redirect came from the expected AS and not a third party.
            Must be sufficiently random and used only once per grant request.
          example: 4edb2194-dbdf-46bb-9397-d5fd57b7c8a7
        interactRef:
          type: string
          description: |-
            The interaction reference generated by the authorization server
            after the payer completes the approval flow. The AS appends this
            value as the interact_ref query parameter to the clientRedirectUri.
            The client must extract it from the redirect and supply it here
            before step 8 can execute. This input intentionally bridges the
            gap between the human interaction in step 7 and the programmatic
            continuation in step 8.
          example: ad82597c-bbfa-4eb0-b72e-328e005b8689
        continueId:
          type: string
          description: |-
            The path segment identifying the continuation resource on the
            authorization server. This is the last segment of the continue.uri
            value returned in the step 7 response. For example, if continue.uri
            is https://auth.interledger-test.dev/continue/4CF492MLVMSW9MKMXKHQ
            then continueId is 4CF492MLVMSW9MKMXKHQ. Arazzo 1.0.1 runtime
            expressions cannot extract a URL path segment from a full URI
            string, so the client implementation is responsible for parsing
            continue.uri and supplying this value before step 8 executes.
          example: 4CF492MLVMSW9MKMXKHQ
        incomingAmount:
          type: object
          description: |-
            Optional. The maximum amount that can be paid into the incoming
            payment created in step 3. When provided, the quote in step 6 is
            automatically derived from this amount. Omit to create an
            open-ended incoming payment and control the amount via debitAmount
            or receiveAmount on the quote instead.
          properties:
            value:
              type: string
              description: Amount as an unsigned 64-bit integer string.
              example: '2500'
            assetCode:
              type: string
              description: ISO 4217 currency code.
              example: USD
            assetScale:
              type: integer
              description: |-
                Number of decimal places. A value of 2500 with assetScale 2
                represents 25.00 USD.
              example: 2
        expiresAt:
          type: string
          format: date-time
          description: |-
            Optional. ISO 8601 datetime after which the incoming payment stops
            accepting funds. The ASE rejects any payment arriving after this
            timestamp.
          example: '2024-12-31T23:59:59Z'
        metadata:
          type: object
          additionalProperties: true
          description: |-
            Optional. Arbitrary key-value pairs stored on the incoming payment
            resource for reconciliation purposes.
          example:
            externalRef: INV-2024-001
        paymentMetadata:
          type: object
          additionalProperties: true
          description: |-
            Optional. Arbitrary key-value pairs stored on the outgoing payment
            resource. Separate from metadata so each resource can carry its own
            reconciliation data independently.
          example:
            description: Thank you for the shoes.

    steps:
      - stepId: get-payee-wallet-address
        description: |-
          Calls the Wallet Address Server at the payee's wallet address URL to
          retrieve the payee's public account details. The authServer field in
          the response is where step 2 sends the incoming payment grant request.
          The resourceServer field is where step 3 creates the incoming payment.

          This is the entry point for the payee side of the workflow. It
          requires no authentication and returns stable, cacheable public data
          about the account.
        operationId: wallet-address-server.get-wallet-address
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          payeeAuthServer: $response.body#/authServer
          payeeResourceServer: $response.body#/resourceServer

      - stepId: request-incoming-payment-grant
        description: |-
          Sends a non-interactive GNAP grant request to the payee's
          authorization server asking for permission to create and read
          incoming payment resources on the payee's wallet.

          Non-interactive means no interact block is included in the request
          body. The authorization server issues an access token immediately
          without redirecting the payee to an approval screen. This is
          acceptable here because creating an incoming payment on a wallet does
          not debit any funds — it only creates a payment destination.

          The identifier field scopes this grant to the specific payee wallet
          address. An access token issued against one wallet address cannot be
          used to create resources on a different wallet address.

          All requests to the authorization server must carry a valid HTTP
          Message Signature (RFC 9421). The client is responsible for
          generating this signature using its private key before sending.
        operationId: auth-server.post-request
        requestBody:
          contentType: application/json
          payload:
            client: $inputs.clientWalletAddress
            access_token:
              access:
                - type: incoming-payment
                  actions:
                    - create
                    - read
                  identifier: $inputs.payeeWalletAddress
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          incomingPaymentAccessToken: $response.body#/access_token/value

      - stepId: create-incoming-payment
        description: |-
          Creates the incoming payment resource on the payee's resource server
          using the access token from step 2. This resource is the payment
          destination — it holds the ILP address and shared secret that the
          ILP network uses to route funds to the payee's account.

          The incomingAmount, expiresAt, and metadata fields are optional. If
          incomingAmount is provided and the incoming payment already has a
          defined cap, the quote in step 6 is derived automatically from it
          and neither debitAmount nor receiveAmount needs to be specified on
          the quote request.

          The id field returned in the response is the incoming payment URL.
          It is passed to step 6 as the receiver so the payer's ASE knows
          where to route the ILP payment, and it appears in the outgoing
          payment grant limits in step 7 to scope the grant precisely to
          this specific payment destination.
        operationId: resource-server.create-incoming-payment
        parameters:
          - name: Authorization
            in: header
            value: "GNAP {$steps.request-incoming-payment-grant.outputs.incomingPaymentAccessToken}"
        requestBody:
          contentType: application/json
          payload:
            walletAddress: $inputs.payeeWalletAddress
            incomingAmount: $inputs.incomingAmount
            expiresAt: $inputs.expiresAt
            metadata: $inputs.metadata
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          incomingPaymentUrl: $response.body#/id

      - stepId: get-payer-wallet-address
        description: |-
          Calls the Wallet Address Server at the payer's wallet address URL to
          retrieve the payer's public account details. The authServer field is
          where steps 5 and 7 send grant requests. The resourceServer field is
          where steps 6 and 9 create the quote and outgoing payment.

          This step mirrors step 1 but operates on the payer's side. The two
          wallet address lookups are kept separate because the payee and payer
          may be hosted on different ASEs with different server URLs.
        operationId: wallet-address-server.get-wallet-address
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          payerAuthServer: $response.body#/authServer
          payerResourceServer: $response.body#/resourceServer

      - stepId: request-quote-grant
        description: |-
          Sends a non-interactive GNAP grant request to the payer's
          authorization server asking for permission to create and read quote
          resources.

          Unlike incoming-payment and outgoing-payment grants, quote grant
          access is not scoped to a specific wallet address identifier. Quotes
          are intermediate computation resources — they represent a price
          commitment from the ASE, not a financial operation on an account —
          so the authorization server grants access at the server level rather
          than scoping it to a particular wallet.

          This grant is non-interactive. The access token is issued immediately.
        operationId: auth-server.post-request
        requestBody:
          contentType: application/json
          payload:
            client: $inputs.clientWalletAddress
            access_token:
              access:
                - type: quote
                  actions:
                    - create
                    - read
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          quoteAccessToken: $response.body#/access_token/value

      - stepId: create-quote
        description: |-
          Creates a quote resource on the payer's resource server. The quote
          is a formal commitment from the payer's ASE to deliver a specific
          amount to the receiver at the current ILP exchange rate. It is valid
          for a short window — typically minutes — before expiring.

          The receiver field points to the incoming payment URL created in
          step 3. The payer's ASE uses this to resolve the ILP path to the
          payee's account and calculate the exchange rate. If the incoming
          payment already carries an incomingAmount, neither debitAmount nor
          receiveAmount needs to be specified here — the ASE derives the quote
          amounts automatically.

          The debitAmount from the quote response is used in step 7 to set
          precise limits on the outgoing payment grant, ensuring the payer
          approves exactly the amount the quote specifies and no more.

          The id field in the response is the quoteId used in step 9 to create
          the outgoing payment. The expiresAt field indicates the deadline —
          the outgoing payment must be created before this timestamp or the
          client must request a new quote.
        operationId: resource-server.create-quote
        parameters:
          - name: Authorization
            in: header
            value: "GNAP {$steps.request-quote-grant.outputs.quoteAccessToken}"
        requestBody:
          contentType: application/json
          payload:
            walletAddress: $inputs.payerWalletAddress
            receiver: $steps.create-incoming-payment.outputs.incomingPaymentUrl
            method: ilp
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          quoteId: $response.body#/id
          debitAmount: $response.body#/debitAmount
          receiveAmount: $response.body#/receiveAmount
          expiresAt: $response.body#/expiresAt

      - stepId: request-outgoing-payment-grant
        description: |-
          Sends an interactive GNAP grant request to the payer's authorization
          server asking for permission to create an outgoing payment. This is
          the only interactive step in the Open Payments protocol.

          Interactive means an interact block is included in the request body.
          The authorization server responds with an interact.redirect URL and
          a continue object, but does not issue an access token yet. The client
          must redirect the payer to the interact.redirect URL so the payer can
          review and approve the payment in the authorization server's interface.

          The access object includes a limits field that constrains what the
          grant permits. The receiver is scoped to the specific incoming payment
          URL from step 3, and the debitAmount is locked to the exact amount
          from the quote in step 6. This means the payer approves this specific
          payment for this specific amount — the access token issued after
          approval cannot be used to make any other payment.

          The finish.nonce (interactNonce) is a random value the client generates
          before this request. The AS echoes it in the finish redirect so the
          client can verify the redirect is genuine and not a replay attack.

          After this step returns, workflow execution must pause. The client
          must redirect the payer to interact.redirect and wait for the payer
          to complete the approval flow. When the AS redirects the payer back
          to clientRedirectUri, it appends an interact_ref query parameter.
          The client captures that value as interactRef and the last segment of
          continue.uri as continueId, then supplies both as workflow inputs
          before step 8 can execute.
        operationId: auth-server.post-request
        requestBody:
          contentType: application/json
          payload:
            client: $inputs.clientWalletAddress
            access_token:
              access:
                - type: outgoing-payment
                  actions:
                    - create
                    - read
                  identifier: $inputs.payerWalletAddress
                  limits:
                    receiver: $steps.create-incoming-payment.outputs.incomingPaymentUrl
                    debitAmount: $steps.create-quote.outputs.debitAmount
            interact:
              start:
                - redirect
              finish:
                method: redirect
                uri: $inputs.clientRedirectUri
                nonce: $inputs.interactNonce
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          interactRedirect: $response.body#/interact/redirect
          continueUri: $response.body#/continue/uri
          continueAccessToken: $response.body#/continue/access_token/value

      - stepId: continue-grant
        description: |-
          Sends a continuation request to the authorization server after the
          payer has approved the outgoing payment grant. This step exchanges
          the interact_ref for a real access token that can be used to create
          the outgoing payment in step 9.

          The path parameter id is the continueId workflow input — the last
          segment of the continue.uri returned in step 7. For example, if
          continue.uri was https://auth.interledger-test.dev/continue/4CF492MLVMSW9MKMXKHQ
          then id is 4CF492MLVMSW9MKMXKHQ. Arazzo 1.0.1 runtime expressions
          cannot extract a path segment from a full URI string, so the client
          implementation is responsible for parsing the continue.uri output
          from step 7 and supplying the extracted segment as this input.

          The Authorization header carries the continue access token from the
          continue.access_token.value field in the step 7 response — not the
          main access token. This is a separate short-lived token that proves
          the continuation request comes from the same client that initiated
          the grant request.

          The interact_ref in the request body is the interactRef workflow
          input — the value the AS appended to the clientRedirectUri after the
          payer approved. The AS uses it to correlate this continuation request
          with the completed interaction.

          On success the AS returns a full access token scoped to the limits
          defined in step 7. This token is used in step 9 to authorize the
          outgoing payment creation.
        operationId: auth-server.post-continue
        parameters:
          - name: id
            in: path
            value: $inputs.continueId
          - name: Authorization
            in: header
            value: "GNAP {$steps.request-outgoing-payment-grant.outputs.continueAccessToken}"
        requestBody:
          contentType: application/json
          payload:
            interact_ref: $inputs.interactRef
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          accessToken: $response.body#/access_token/value

      - stepId: create-outgoing-payment
        description: |-
          Creates the outgoing payment resource on the payer's resource server
          using the access token from step 8. This is the step that moves funds.

          Once the outgoing payment resource is created, the payer's ASE begins
          executing the ILP payment immediately. The ASE sends ILP packets to
          the incoming payment's ILP address until the receiveAmount has been
          delivered or the debitAmount has been exhausted, whichever comes first.

          The quoteId field references the quote created in step 6. The payer's
          ASE uses the quote to determine the exact amounts and ILP path without
          recalculating the exchange rate. If the quote has expired by the time
          this request is made, the ASE returns a 403 and the client must restart
          from step 5 to obtain a fresh quote.

          The id field in the response is the outgoing payment URL. The failed
          field indicates whether the ASE was able to execute the payment. A
          newly created outgoing payment always starts with failed set to false —
          if execution fails asynchronously the ASE updates failed to true on
          the resource.
        operationId: resource-server.create-outgoing-payment
        parameters:
          - name: Authorization
            in: header
            value: "GNAP {$steps.continue-grant.outputs.accessToken}"
        requestBody:
          contentType: application/json
          payload:
            walletAddress: $inputs.payerWalletAddress
            quoteId: $steps.create-quote.outputs.quoteId
            metadata: $inputs.paymentMetadata
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          outgoingPaymentId: $response.body#/id
          failed: $response.body#/failed
          sentAmount: $response.body#/sentAmount
          debitAmount: $response.body#/debitAmount
          receiveAmount: $response.body#/receiveAmount

    outputs:
      outgoingPaymentId: $steps.create-outgoing-payment.outputs.outgoingPaymentId
      incomingPaymentUrl: $steps.create-incoming-payment.outputs.incomingPaymentUrl
      quoteId: $steps.create-quote.outputs.quoteId
      failed: $steps.create-outgoing-payment.outputs.failed
